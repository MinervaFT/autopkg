Description: |
  Version-stamps the vendor-supplied Elgato Stream Deck installer package.

  The vendor download is already a signed flat package, so it is copied
  rather than rebuilt - repackaging would discard Elgato's install scripts.
  The version is read from the app inside the package payload.
Identifier: au.edu.tafe-jamf.pkg.ElgatoStreamDeck
ParentRecipe: com.github.dataJAR-recipes.download.Elgato Stream Deck
MinimumVersion: "2.3"

Input:
  NAME: ElgatoStreamDeck

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpack/Stream_Deck.pkg/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      purge_destination: true

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/payload/Applications/Stream Deck.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
