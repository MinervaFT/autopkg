Description: |
  Version-stamps the vendor-supplied McDSP Native (NV) installer package.

  Replaces com.github.MinervaFT.pkg.McDSPNVInstaller, which passes
  'result_output_var_name' to FileFinder. FileFinder does not support that
  argument - it always writes to 'found_filename' - so every downstream
  reference such as %installer_pkg% was passed through unresolved and
  FlatPkgUnpacker failed with a literal '%installer_pkg%' path.

  Because each FileFinder overwrites the previous %found_filename%, the top
  level installer package is located again at the end rather than being
  copied to a holding path - the McDSP installers are several GB and a
  duplicate copy would be wasteful.
Identifier: au.edu.tafe-jamf.pkg.McDSPNVInstaller
ParentRecipe: au.edu.tafe-jamf.download.McDSPNVInstaller
MinimumVersion: "2.3"

Input:
  NAME: McDSPNVInstaller

Process:
  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/package"
      purge_destination: true

  # Top-level vendor installer package.
  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/package/*.pkg"

  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: "%found_filename%"
      destination_path: "%RECIPE_CACHE_DIR%/unpack"
      purge_destination: true

  # Nested component package inside the expanded flat package.
  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/unpack/*.pkg"

  - Processor: PkgPayloadUnpacker
    Arguments:
      pkg_payload_path: "%found_filename%/Payload"
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      purge_destination: true

  # The installer payload holds zipped plug-in bundles.
  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/payload/*.zip"

  - Processor: Unarchiver
    Arguments:
      archive_path: "%found_filename%"
      destination_path: "%RECIPE_CACHE_DIR%/unarchive"
      purge_destination: true

  # Any one component bundle carries the product version.
  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/unarchive/*/*.component"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%found_filename%/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  # Re-locate the top-level installer, then copy it out version-stamped.
  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/package/*.pkg"

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%found_filename%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"

  # These expand to tens of GB; drop them once the package is staged.
  # 'package' is safe to remove - Unarchiver re-extracts it on every run.
  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpack"
        - "%RECIPE_CACHE_DIR%/payload"
        - "%RECIPE_CACHE_DIR%/unarchive"
        - "%RECIPE_CACHE_DIR%/package"
