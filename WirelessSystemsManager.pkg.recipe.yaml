Description: |
  Packages the Sennheiser Wireless Systems Manager (WSM) into a flat
  installer package.

  The vendor ships a disk image containing WSM.app with no installer, so the
  app is copied out of the mounted image into a package root owned by
  root:admin and packaged with PkgCreator.
Identifier: au.edu.tafe-jamf.pkg.WirelessSystemsManager
ParentRecipe: com.github.dataJAR-recipes.download.Sennheiser Wireless Systems Manager
MinimumVersion: "2.3"

Input:
  NAME: WirelessSystemsManager
  BUNDLE_ID: com.Sennheiser.WSM

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs:
        Applications: "0775"

  - Processor: Copier
    Arguments:
      source_path: "%pathname%/WSM.app"
      destination_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/WSM.app"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/WSM.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        pkgname: "%NAME%-%version%"
        pkgdir: "%RECIPE_CACHE_DIR%"
        id: "%BUNDLE_ID%"
        version: "%version%"
        options: purge_ds_store
        chown:
          - path: Applications
            user: root
            group: admin
