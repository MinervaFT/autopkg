Description: |
  Packages Focusrite Control 2 into a flat installer package.

  The vendor ships a disk image containing the app with no installer, so the
  app is copied out of the mounted image into a package root owned by
  root:admin and packaged with PkgCreator.
Identifier: au.edu.tafe-jamf.pkg.FocusriteControl2
ParentRecipe: com.github.dataJAR-recipes.download.Focusrite Control 2
MinimumVersion: "2.3"

Input:
  NAME: FocusriteControl2
  APP_NAME: Focusrite Control 2.app
  BUNDLE_ID: com.focusrite.control

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs:
        Applications: "0775"

  - Processor: Copier
    Arguments:
      source_path: "%pathname%/%APP_NAME%"
      destination_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/%APP_NAME%"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/%APP_NAME%/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        pkgname: "%NAME%-%version%"
        pkgdir: "%RECIPE_CACHE_DIR%"
        id: "%BUNDLE_ID%"
        version: "%version%"
        options: purge_ds_store
        chown:
          - path: Applications
            user: root
            group: admin
