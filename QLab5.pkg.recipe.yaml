Description: |
  Packages QLab 5 into a flat installer package.

  The parent download recipe unarchives QLab.app into the recipe cache and
  verifies its signature. The app is staged into a package root owned by
  root:admin and packaged with PkgCreator.
Identifier: au.edu.tafe-jamf.pkg.QLab5
ParentRecipe: com.github.dataJAR-recipes.download.QLab5
MinimumVersion: "2.3"

Input:
  NAME: QLab5
  BUNDLE_ID: com.figure53.QLab.5

Process:
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs:
        Applications: "0775"

  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/%NAME%/Applications/QLab.app"
      destination_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/QLab.app"

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/pkgroot/Applications/QLab.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCreator
    Arguments:
      pkg_request:
        pkgname: "%NAME%-%version%"
        pkgdir: "%RECIPE_CACHE_DIR%"
        id: "%BUNDLE_ID%"
        version: "%version%"
        options: purge_ds_store
        chown:
          - path: Applications
            user: root
            group: admin
